# Copy to config/rules.yaml and edit.
# The monitor reloads this file on every poll, so you can change rules without restarting.

# The day-30 after-hours rule uses the poll interval. Pullback, after-hours
# boost, top 5, and the last two hours still scan the board. Trend names are
# stored near the close. Five-day names are taken once after the close:
# day change above 50%, cap at or under $100M, and volume above 100,000.
# The 90% list keeps every name that exceeded 90% during the session.
# Premarket and after-hours only snapshot those names.
poll_interval_seconds: 2
scanner_interval_seconds: 2
background_scan_interval_seconds: 5
poll_when_closed: true
feed: iex
scanner_feed: iex
stream_all_trades: false

watchlist: []

# Rules sit under afterhours, premarket, or regular. The section is the rule's session and must match the condition.
# name is the short name and the 同花顺 group. description is shown in alerts.
rules:
  afterhours:
    - id: afterhours-30-hold25
      name: 盘后涨幅超30%的股票
      description: 盘后涨幅超过30%，15分钟后仍在25%以上，总市值不超过5亿美元，成交量超过10万
      label: After-hours boost
      notify: Afterhours-boost
      symbol: "*"
      enabled: true
      cooldown_minutes: 240
      condition:
        type: afterhours_gain
        value: 25
        min_prior_change: 30
        prior_change_lag_minutes: 15
        max_market_cap: 500000000
        min_volume: 100000
      slack_message: "{stock_name}{field_gap}{move_text}{price_text}"

    - id: afterhours-day30-ah4
      name: 盘中涨幅超30%的股票
      description: 盘中涨幅超30%，盘后5分钟内涨幅保持在-10%到10%，市值低于5亿美元
      label: Day 30% boost
      notify: Day-30-boost
      symbol: "*"
      enabled: true
      cooldown_minutes: 240
      condition:
        type: afterhours_gain
        value: 5
        min_regular_change: 30
        max_market_cap: 500000000
        min_volume: 100000
        stable_minutes: 5
        stable_low: -10
        stable_high: 10
      slack_message: "{stock_name}{field_gap}{move_text}{price_text}"

    - id: afterhours-uptrend-day10-ah5
      name: 走势向上
      description: 盘中涨幅超20%且走势向上，盘中成交量超100万，盘后涨幅超5%，盘后成交量超10万，市值不超过5亿美元
      label: Trend boost
      notify: Trend-boost
      symbol: "*"
      enabled: true
      cooldown_minutes: 240
      condition:
        type: afterhours_gain
        value: 5
        min_regular_change: 20
        min_regular_volume: 1000000
        min_volume: 100000
        max_market_cap: 500000000
        require_uptrend: true
      slack_message: "{stock_name}{field_gap}{move_text}{price_text}"

    - id: afterhours-5d50-ah5
      name: 盘后5日涨幅超50%的股票
      description: 过去5天有一天涨幅超50%，盘后涨幅超5%，总市值不超过5亿美元，成交量超过10万
      label: 5-day after-hours boost
      notify: 5-day-afterhours-boost
      symbol: "*"
      enabled: true
      cooldown_minutes: 240
      condition:
        type: afterhours_gain
        value: 5
        min_recent_day_change: 50
        recent_day_count: 5
        max_market_cap: 500000000
        min_volume: 100000
      slack_message: "{stock_name}{field_gap}{move_text}{price_text}"

    - id: afterhours-last-2h-20
      name: 盘后尾盘
      description: 盘后结束前2小时突然涨幅超20%，总市值不超过5亿美元，成交量超过10万，价格高于0.1美元
      label: After-hours last 2 hours
      notify: Afterhours-last-2-hours
      symbol: "*"
      enabled: true
      cooldown_minutes: 240
      condition:
        type: late_session_gain
        value: 20
        late_session_hours: 2
        late_session: afterhours
        min_price: 0.1
        max_market_cap: 500000000
        min_volume: 100000
      slack_message: "{stock_name}{field_gap}{move_text}{price_text}"

    - id: afterhours-top5
      name: 盘后涨幅前5的股票
      description: 盘后涨幅前5，总市值不超过5亿美元，成交量超过10万
      label: Top 5 after-hours boost
      notify: Top-5-afterhours-boost
      symbol: "*"
      enabled: true
      cooldown_minutes: 30
      condition:
        type: afterhours_gain
        value: 0
        max_market_cap: 500000000
        min_volume: 100000
        top_n: 5
      slack_message: "{stock_name}{field_gap}{price_text}"

    - id: afterhours-gain80
      name: 盘后涨幅超80%的股票
      description: 盘后涨幅超过80%，市值不超过5亿美元
      label: After-hours 80% boost
      notify: Afterhours-80-boost
      symbol: "*"
      enabled: true
      cooldown_minutes: 240
      condition:
        type: afterhours_gain
        value: 80
        max_market_cap: 500000000
      slack_message: "{stock_name}{field_gap}{move_text}{price_text}"

  regular:
    - id: regular-halt-close15
      name: 盘中触发过涨幅熔断的股票
      description: 盘中收盘前15分钟，当天触发过涨幅熔断，市值不超过5亿美元
      label: Halt boost
      notify: Halt-boost
      symbol: "*"
      enabled: true
      cooldown_minutes: 390
      condition:
        type: regular_close
        close_minutes: 15
        max_market_cap: 500000000
        require_circuit_breaker: true
      slack_message: "{stock_name}{field_gap}{move_text}{price_text}"

    - id: regular-gain80
      name: 盘中涨幅超80%的股票
      description: 盘中涨幅超过80%，市值不超过5亿美元
      label: Regular 80% boost
      notify: Regular-80-boost
      symbol: "*"
      enabled: true
      cooldown_minutes: 390
      condition:
        type: regular_gain
        value: 80
        max_market_cap: 500000000
      slack_message: "{stock_name}{field_gap}{move_text}{price_text}"

    - id: regular-last-hour-20
      name: 盘中尾盘
      description: 盘中收盘前2小时突然涨幅超20%，总市值不超过5亿美元，成交量超过10万，价格高于0.1美元
      label: Last hour boost
      notify: Last-hour-boost
      symbol: "*"
      enabled: true
      cooldown_minutes: 390
      condition:
        type: late_session_gain
        value: 20
        late_session_hours: 2
        min_price: 0.1
        max_market_cap: 500000000
        min_volume: 100000
      slack_message: "{stock_name}{field_gap}{move_text}{price_text}"

  premarket:
    - id: premarket-30-hold25
      name: 盘前涨幅超30%的股票
      description: 盘前涨幅超过30%，15分钟后仍在25%以上，总市值不超过5亿美元，成交量超过10万
      label: Premarket boost
      notify: Premarket-boost
      symbol: "*"
      enabled: true
      cooldown_minutes: 330
      condition:
        type: premarket_gain
        value: 25
        min_prior_change: 30
        prior_change_lag_minutes: 15
        max_market_cap: 500000000
        min_volume: 100000
      slack_message: "{stock_name}{field_gap}{move_text}{price_text}"

    - id: premarket-day50-ext5
      name: 盘前5日涨幅超50%的股票
      description: 过去5天有一天涨幅超50%，盘前涨幅超5%，总市值不超过5亿美元，成交量超过10万
      label: 5-day premarket boost
      notify: 5-day-premarket-boost
      symbol: "*"
      enabled: true
      cooldown_minutes: 330
      condition:
        type: premarket_gain
        value: 5
        min_recent_day_change: 50
        recent_day_count: 5
        max_market_cap: 500000000
        min_volume: 100000
      slack_message: "{stock_name}{field_gap}{move_text}{price_text}"

    - id: premarket-last-3h-20
      name: 盘前涨幅超20%的股票
      description: 盘前结束前3小时突然涨幅超20%，总市值不超过5亿美元，成交量超过10万，价格高于0.1美元
      label: Premarket last 3 hours
      notify: Premarket-last-3-hours
      symbol: "*"
      enabled: true
      cooldown_minutes: 330
      condition:
        type: late_session_gain
        value: 20
        late_session_hours: 3
        late_session: premarket
        min_price: 0.1
        max_market_cap: 500000000
        min_volume: 100000
      slack_message: "{stock_name}{field_gap}{move_text}{price_text}"

    - id: premarket-gain80
      name: 盘前涨幅超80%的股票
      description: 盘前涨幅超过80%，市值不超过5亿美元
      label: Premarket 80% boost
      notify: Premarket-80-boost
      symbol: "*"
      enabled: true
      cooldown_minutes: 330
      condition:
        type: premarket_gain
        value: 80
        max_market_cap: 500000000
      slack_message: "{stock_name}{field_gap}{move_text}{price_text}"
