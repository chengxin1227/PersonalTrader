# Copy to config/rules.yaml and edit.
# The monitor reloads this file on every poll, so you can change rules without restarting.

poll_interval_seconds: 1
scanner_interval_seconds: 1
poll_when_closed: true
feed: iex
scanner_feed: iex
stream_all_trades: false

watchlist: []

rules:
  - id: premarket-smallcap-10pct
    name: 盘前目前涨幅超10%，5分钟前曾超20%，总市值不超过1亿美元，成交量超过10万
    symbol: "*"
    enabled: true
    cooldown_minutes: 240
    condition:
      type: premarket_gain
      value: 10
      min_prior_change: 20
      prior_change_lag_minutes: 5
      max_market_cap: 100000000
      min_volume: 100000
    slack_message: "{stock_name}{field_gap}{move_text}{price_text}"

  - id: afterhours-smallcap-10pct
    name: 盘后目前涨幅超10%，5分钟前曾超20%，总市值不超过1亿美元，成交量超过10万
    symbol: "*"
    enabled: true
    cooldown_minutes: 240
    condition:
      type: afterhours_gain
      value: 10
      min_prior_change: 20
      prior_change_lag_minutes: 5
      max_market_cap: 100000000
      min_volume: 100000
    slack_message: "{stock_name}{field_gap}{move_text}{price_text}"

  - id: afterhours-day30-ah4
    name: 盘中涨幅超30%，盘后涨幅超3%，市值低于1亿美元
    symbol: "*"
    enabled: true
    cooldown_minutes: 240
    condition:
      type: afterhours_gain
      value: 3
      min_regular_change: 30
      max_market_cap: 100000000
    slack_message: "{stock_name}{field_gap}{move_text}{price_text}"

  - id: afterhours-uptrend-day10-ah5
    name: 盘中涨幅超10%且走势向上，盘中成交量超100万，盘后涨幅超5%，盘后成交量超10万，市值不超过1亿美元
    symbol: "*"
    enabled: true
    cooldown_minutes: 240
    condition:
      type: afterhours_gain
      value: 5
      min_regular_change: 10
      min_regular_volume: 1000000
      min_volume: 100000
      max_market_cap: 100000000
      require_uptrend: true
    slack_message: "{stock_name}{field_gap}{move_text}{price_text}"

  - id: afterhours-circuit-breaker-day10-ah5
    name: 盘中收盘涨幅超10%并触发涨幅熔断，盘后涨幅超5%，市值不超过1亿美元
    symbol: "*"
    enabled: true
    cooldown_minutes: 240
    condition:
      type: afterhours_gain
      value: 5
      min_regular_change: 10
      max_market_cap: 100000000
      require_circuit_breaker: true
    slack_message: "{stock_name}{field_gap}{move_text}{price_text}"
