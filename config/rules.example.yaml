# Copy to config/rules.yaml and edit.
# The monitor reloads this file on every poll, so you can change rules without restarting.

# The day-30 after-hours rule uses the poll interval. Pullback, after-hours
# boost, top 5, and the last two hours still scan the board. Trend names are
# stored near the close. Five-day names are taken once after the close:
# day change above 50%, cap at or under $100M, and volume above 100,000.
# Halt/80% alerts on first regular-session pool entry, then again in
# after-hours when AH gain > 5%. AH>50% and halt/80% boards: half-hour
# top 5 by AH gain, single alerts when
# AH first clears the line, volume after the open, 同花顺 gets the full pool.
poll_interval_seconds: 2
scanner_interval_seconds: 2
background_scan_interval_seconds: 5
poll_when_closed: true
feed: iex
scanner_feed: iex
stream_all_trades: false

watchlist: []

# Rules sit under afterhours, premarket, or regular. The section is the rule's session and must match the condition.
# name is the short name and the 同花顺 group.
# description is under single-stock alerts; board_description is under top-N digests.
rules:
  afterhours:
    - id: afterhours-day30-ah4
      name: 盘中涨幅超30%的股票
      description: 盘中涨幅超30%，盘后5分钟内涨幅保持在-10%到10%，市值低于10亿美元
      label: Day 30% boost
      notify: Day-30-boost
      symbol: "*"
      enabled: true
      cooldown_minutes: 240
      condition:
        type: afterhours_gain
        value: 5
        min_regular_change: 30
        max_market_cap: 1000000000
        min_volume: 100000
        stable_minutes: 5
        stable_low: -10
        stable_high: 10
      slack_message: "{stock_name}{field_gap}{move_text}{price_text}"

    - id: afterhours-uptrend-day10-ah5
      name: 走势向上
      description: 盘中涨幅超20%且走势向上，盘中成交量超100万，盘后涨幅超5%，盘后成交量超10万，市值不超过10亿美元
      label: Trend boost
      notify: Trend-boost
      symbol: "*"
      enabled: true
      cooldown_minutes: 240
      condition:
        type: afterhours_gain
        value: 5
        min_regular_change: 20
        min_regular_volume: 1000000
        min_volume: 100000
        max_market_cap: 1000000000
        require_uptrend: true
      slack_message: "{stock_name}{field_gap}{move_text}{price_text}"

    - id: afterhours-5d50-ah5
      name: 5日曾涨超50%盘后超5%的股票
      description: 过去5天有一天涨幅超50%，盘后涨幅超5%，总市值不超过10亿美元，成交量超过1万
      label: 5-day after-hours boost
      notify: 5-day-afterhours-boost
      symbol: "*"
      enabled: true
      cooldown_minutes: 240
      condition:
        type: afterhours_gain
        value: 5
        min_recent_day_change: 50
        recent_day_count: 5
        max_market_cap: 1000000000
        min_volume: 10000
      slack_message: "{stock_name}{field_gap}{move_text}{price_text}"

    - id: afterhours-30-newhigh
      name: 盘后涨超30%后再创新高的股票
      description: 盘后涨幅超过30%，15分钟后任意时刻涨幅超过此前最高涨幅，总市值不超过10亿美元，成交量超过10万
      label: After-hours new high
      notify: Afterhours-30-newhigh
      symbol: "*"
      enabled: true
      cooldown_minutes: 30
      condition:
        type: afterhours_gain
        value: 30
        require_new_high: true
        prior_change_lag_minutes: 15
        max_market_cap: 1000000000
        min_volume: 100000
      slack_message: "{stock_name}{field_gap}{move_text}{price_text}"

    - id: afterhours-sudden-10
      name: 盘后1分钟涨超10%的股票
      description: 盘后涨幅已超10%，约1分钟内再涨超10%，总市值不超过10亿美元，成交量超过10万，价格高于0.1美元
      label: After-hours sudden 10%
      notify: Afterhours-sudden-10
      symbol: "*"
      enabled: true
      cooldown_minutes: 30
      condition:
        type: sudden_gain
        value: 10
        pool_min_change: 10
        sudden_window_seconds: 60
        late_session: afterhours
        min_price: 0.1
        max_market_cap: 1000000000
        min_volume: 100000
      slack_message: "{stock_name}{field_gap}{move_text}{price_text}"

    - id: afterhours-top5-ah50
      name: 盘后涨超50%的股票
      description: 盘后首次涨超50%，成交量超过10万（16:00开盘除外），总市值不超过10亿美元
      board_description: 盘后曾涨超50%，半点按盘后涨幅取前5，成交量超过10万（16:00开盘除外），总市值不超过10亿美元
      label: After-hours 50%
      notify: Top-5-afterhours-boost
      symbol: "*"
      enabled: true
      cooldown_minutes: 240
      condition:
        type: afterhours_gain
        value: 50
        max_market_cap: 1000000000
        min_volume: 100000
        top_n: 5
        min_afterhours_touch: 50
      slack_message: "{stock_name}{field_gap}{move_text}{price_text}"

    - id: afterhours-halt-or-day80
      name: 盘中熔断或涨超80%的股票
      description: 盘中首次涨超80%或触发涨幅熔断时提醒；盘后首次超5%再提醒，成交量超过10万（16:00开盘除外），总市值不超过10亿美元
      board_description: 盘中曾涨超80%或盘中触发过涨幅熔断，半点按盘后涨幅取前5，成交量超过10万（16:00开盘除外），总市值不超过10亿美元；同花顺按最高涨幅与收盘涨幅之差从大到小排
      label: Halt or 80%
      notify: Halt-boost
      symbol: "*"
      enabled: true
      cooldown_minutes: 240
      condition:
        type: afterhours_gain
        value: 5
        max_market_cap: 1000000000
        min_volume: 100000
        top_n: 5
        min_regular_touch: 80
        include_circuit_breaker: true
        require_circuit_breaker: true
        min_recent_day_change: 80
        recent_day_count: 1
        intraday_touch: true
      slack_message: "{stock_name}{field_gap}{move_text}{price_text}"

  regular:
    - id: regular-30-newhigh
      name: 盘中涨超30%后再创新高的股票
      description: 盘中涨幅超过30%，15分钟后任意时刻涨幅超过此前最高涨幅，总市值不超过10亿美元，成交量超过10万
      label: Regular new high
      notify: Regular-30-newhigh
      symbol: "*"
      enabled: true
      cooldown_minutes: 30
      condition:
        type: regular_gain
        value: 30
        require_new_high: true
        prior_change_lag_minutes: 15
        max_market_cap: 1000000000
        min_volume: 100000
      slack_message: "{stock_name}{field_gap}{move_text}{price_text}"

    - id: regular-sudden-10
      name: 盘中1分钟涨超10%的股票
      description: 盘中涨幅已超10%，约1分钟内再涨超10%，总市值不超过10亿美元，成交量超过10万，价格高于0.1美元
      label: Regular sudden 10%
      notify: Regular-sudden-10
      symbol: "*"
      enabled: true
      cooldown_minutes: 30
      condition:
        type: sudden_gain
        value: 10
        pool_min_change: 10
        sudden_window_seconds: 60
        late_session: regular
        min_price: 0.1
        max_market_cap: 1000000000
        min_volume: 100000
      slack_message: "{stock_name}{field_gap}{move_text}{price_text}"

  premarket:
    - id: premarket-30-newhigh
      name: 盘前涨超30%后再创新高的股票
      description: 盘前涨幅超过30%，15分钟后任意时刻涨幅超过此前最高涨幅，总市值不超过10亿美元，成交量超过10万
      label: Premarket new high
      notify: Premarket-30-newhigh
      symbol: "*"
      enabled: true
      cooldown_minutes: 30
      condition:
        type: premarket_gain
        value: 30
        require_new_high: true
        prior_change_lag_minutes: 15
        max_market_cap: 1000000000
        min_volume: 100000
      slack_message: "{stock_name}{field_gap}{move_text}{price_text}"

    - id: premarket-day50-ext5
      name: 5日曾涨超50%盘前超5%的股票
      description: 过去5天有一天涨幅超50%，盘前涨幅超5%，总市值不超过10亿美元，成交量超过1万
      label: 5-day premarket boost
      notify: 5-day-premarket-boost
      symbol: "*"
      enabled: true
      cooldown_minutes: 330
      condition:
        type: premarket_gain
        value: 5
        min_recent_day_change: 50
        recent_day_count: 5
        max_market_cap: 1000000000
        min_volume: 10000
      slack_message: "{stock_name}{field_gap}{move_text}{price_text}"

    - id: premarket-sudden-10
      name: 盘前1分钟涨超10%的股票
      description: 盘前涨幅已超10%，约1分钟内再涨超10%，总市值不超过10亿美元，成交量超过10万，价格高于0.1美元
      label: Premarket sudden 10%
      notify: Premarket-sudden-10
      symbol: "*"
      enabled: true
      cooldown_minutes: 30
      condition:
        type: sudden_gain
        value: 10
        pool_min_change: 10
        sudden_window_seconds: 60
        late_session: premarket
        min_price: 0.1
        max_market_cap: 1000000000
        min_volume: 100000
      slack_message: "{stock_name}{field_gap}{move_text}{price_text}"
